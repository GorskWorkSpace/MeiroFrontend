name: Build and Push Frontend Image

# Запускается при push в ветку dev ИЛИ вручную через GitHub UI
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина ручного запуска (необязательно)'
        required: false
        default: 'Ручной запуск'

jobs:
  build-and-push:
    name: Build Docker Image & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Логинимся в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Настраиваем Docker Buildx (для быстрой и эффективной сборки)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Собираем и пушим образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Пушим с двумя тегами: latest и хэш коммита (для отката)
          tags: |
            murkats/meiromap-frontend-react:latest
            murkats/meiromap-frontend-react:${{ github.sha }}
          # Кэшируем слои для ускорения последующих сборок
          cache-from: type=gha
          cache-to: type=gha,mode=max
